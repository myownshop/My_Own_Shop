    </text>

    <!-- Feature Highlights Row -->
    <g transform="translate(0, 336)">
      <rect x="0" y="0" width="205" height="54" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="26" cy="27" r="10" fill="#00D27A" />
      <path d="M22 27l3 3 6-6" stroke="#0B1F17" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="46" y="24" font-family="DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Safe Payment</text>
      <text x="46" y="41" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">Pay when delivered</text>

      <rect x="220" y="0" width="205" height="54" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="246" cy="27" r="10" fill="#FFB400" />
      <path d="M242 27l3 3 6-6" stroke="#0B1F17" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="266" y="24" font-family="DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Fast Delivery</text>
      <text x="266" y="41" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">Live map tracking</text>

      <rect x="440" y="0" width="205" height="54" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="466" cy="27" r="10" fill="#00D27A" />
      <path d="M462 27l3 3 6-6" stroke="#0B1F17" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="486" y="24" font-family="DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Trusted Sellers</text>
      <text x="486" y="41" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">Verified across Nigeria</text>
