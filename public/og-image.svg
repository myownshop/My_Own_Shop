<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F17" />
      <stop offset="55%" stop-color="#14181F" />
      <stop offset="100%" stop-color="#0E291E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D27A" />
      <stop offset="100%" stop-color="#00A862" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Top Accent Strip -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#accentGrad)" />

  <!-- Subtle Grid Pattern -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="740" y1="0" x2="740" y2="630" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(72, 76)">
    <!-- Brand Mark + Badge -->
    <g transform="scale(0.8125)">
      <rect width="64" height="64" rx="14" fill="#00D27A" />
      <path
        d="M11 16H17.5L22.5 39H46.5L51.5 22H20"
        stroke="#0B1F17"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
      <path d="M20 22H51.5L46.5 39H22.5L20 22Z" fill="#0B1F17" />
      <circle cx="35.5" cy="30.5" r="3.5" fill="#FFB400" />
      <circle cx="25" cy="48.5" r="4.5" fill="#0B1F17" />
      <circle cx="44" cy="48.5" r="4.5" fill="#0B1F17" />
    </g>
    <text x="68" y="36" font-family="DM Sans, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      IBO Hub
    </text>
    <rect x="220" y="12" width="248" height="30" rx="4" fill="#00D27A" fill-opacity="0.16" stroke="#00D27A" stroke-width="1.5" />
    <text x="236" y="32" font-family="DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#00D27A" letter-spacing="0.8">
      NIGERIA ONLINE MARKETPLACE
