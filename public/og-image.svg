    <line x1="54" y1="224" x2="92" y2="224" stroke="#FFB400" stroke-width="2" />
    <text x="61" y="250" font-family="DM Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFB400">50KG</text>
    <text x="146" y="212" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFB400" letter-spacing="0.6">DIRECT FROM MILL</text>
    <text x="146" y="240" font-family="DM Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Bulk Food &amp; Rice</text>
    <text x="146" y="264" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF">50kg Rice, Beans &amp; Oils</text>
    <text x="146" y="290" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#00D27A">From ₦42,000</text>

    <!-- Card 3: Solar & Electronics -->
    <rect x="0" y="336" width="358" height="145" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="352" width="113" height="113" rx="6" fill="#0F172A" stroke="#00D27A" stroke-width="1.5" />
    <!-- Solar Panel Grid Illustration -->
    <rect x="42" y="376" width="62" height="64" rx="4" fill="#1E293B" stroke="#00D27A" stroke-width="2.5" />
    <line x1="62" y1="376" x2="62" y2="440" stroke="#00D27A" stroke-width="1.5" />
    <line x1="83" y1="376" x2="83" y2="440" stroke="#00D27A" stroke-width="1.5" />
    <line x1="42" y1="397" x2="104" y2="397" stroke="#00D27A" stroke-width="1.5" />
    <line x1="42" y1="419" x2="104" y2="419" stroke="#00D27A" stroke-width="1.5" />
    <text x="146" y="380" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#00D27A" letter-spacing="0.6">HOME POWER</text>
    <text x="146" y="408" font-family="DM Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Solar &amp; Inverters</text>
    <text x="146" y="432" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF">550W Panels &amp; Batteries</text>
    <text x="146" y="458" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFB400">From ₦92,000</text>
  </g>
