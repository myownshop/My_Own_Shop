    </text>
    <text x="0" y="198" font-family="DM Sans, Arial, sans-serif" font-size="50" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      Solar &amp; Home Essentials
    </text>

    <!-- Subheadline / Description -->
    <text x="0" y="256" font-family="DM Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#D1D5DB">
      Buy from trusted Nigerian sellers with safe payment protection.
    </text>
    <text x="0" y="288" font-family="DM Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#D1D5DB">
