  <!-- Right Product Showcase Cards -->
  <g transform="translate(770, 68)">
    <!-- Card 1: Phones & Tech -->
    <rect x="0" y="0" width="358" height="145" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="16" width="113" height="113" rx="6" fill="#0F172A" stroke="#00D27A" stroke-width="1.5" />
